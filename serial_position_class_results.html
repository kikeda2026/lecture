<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>系列位置効果｜クラス全体の結果</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet"><style>
:root{--navy:#1A2340;--green:#2EAA6E;--gray:#8A94A6;--bg:#F4F6FA;--border:#E2E8F0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:'Noto Sans JP',sans-serif}header{background:var(--navy);color:white;padding:28px 5%}h1{font-family:'Noto Serif JP',serif;font-size:clamp(1.3rem,4vw,1.9rem);margin:0 0 8px}header p{margin:0;opacity:.75;font-size:.88rem}main{max-width:880px;margin:auto;padding:24px 16px}.card{background:white;border:1px solid var(--border);padding:20px;border-radius:4px;margin-bottom:16px}.btn{background:var(--green);color:white;border:0;border-radius:3px;padding:12px 20px;font:700 1rem 'Noto Sans JP',sans-serif;cursor:pointer}#status{color:#607084;font-size:.85rem;margin-top:10px}.metrics{display:flex;gap:12px;flex-wrap:wrap}.metric{background:#ebf7f2;padding:12px 18px;min-width:160px}.metric strong{font-size:1.5rem}svg{width:100%;height:auto;display:block}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:.87rem}.key{display:inline-block;width:17px;height:4px;vertical-align:middle;margin-right:8px}table{border-collapse:collapse;width:100%;font-size:.83rem}td,th{padding:7px 5px;text-align:center;border-bottom:1px solid #e5e9f0}.scroll{overflow-x:auto}.notice{font-size:.82rem;color:#606f83;line-height:1.8}</style></head><body><header><h1>系列位置効果｜クラス全体の結果</h1><p>直後再生と妨害課題後再生を比較する</p></header><main><section class="card"><div class="metrics"><div class="metric">集計完了件数<br><strong id="count">—</strong></div><div class="metric">最終更新<br><span id="updated">—</span></div></div><p><button id="refresh" class="btn">最新の結果に更新</button></p><p id="status" role="status">接続を準備しています。</p></section><section class="card"><h2>系列位置別の再生率</h2><div class="legend"><span><i class="key" style="background:#2EAA6E"></i>直後再生</span><span><i class="key" style="background:#E8973A"></i>妨害課題後再生</span></div><svg id="graph" viewBox="0 0 760 350" aria-label="クラスの再生率グラフ" role="img"></svg><p class="notice">各系列位置の再生率＝その位置の単語を正しく再生した人数÷集計完了件数×100。各条件で異なる単語リストを使用しています。</p></section><section class="card"><h2>区間別の平均再生率</h2><div class="scroll"><table><thead><tr><th>条件</th><th>初頭（1〜5）</th><th>中間（6〜10）</th><th>新近（11〜15）</th></tr></thead><tbody id="region"></tbody></table></div></section><p class="notice">匿名の送信件数を集計します。同じ人が複数回実施した場合も別件として数えます。学術的な厳密な推定ではなく，授業用デモです。更新は45秒ごとに確認します。</p></main><script>
'use strict';
const GAS_WEB_APP_URL='https://script.google.com/macros/s/AKfycbyhLI-Y1qgReHdU-WL5HkdDcqYZRzxnlafOLp7LU0SWli2l3yQGIA1GrfkKVqngX-Rc/exec';
const $=x=>document.getElementById(x);
const NS='http://www.w3.org/2000/svg';
const svgEl=(name,attrs,text)=>{const e=document.createElementNS(NS,name);for(const [k,v] of Object.entries(attrs||{}))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e};
function draw(s){const g=$('graph');g.replaceChildren();const x=i=>56+i*46.8,y=v=>296-v*2.5;
for(let v=0;v<=100;v+=25){g.append(svgEl('line',{x1:56,y1:y(v),x2:725,y2:y(v),stroke:'#e2e8f0'}),svgEl('text',{x:47,y:y(v)+4,'text-anchor':'end',fill:'#67748c','font-size':'14'},v+'%'))}
for(let i=0;i<15;i++)g.append(svgEl('text',{x:x(i),y:323,'text-anchor':'middle',fill:'#67748c','font-size':'13'},String(i+1)));
g.append(svgEl('text',{x:380,y:345,'text-anchor':'middle',fill:'#67748c','font-size':'14'},'提示位置'));
if(!s.count){g.append(svgEl('text',{x:380,y:150,'text-anchor':'middle',fill:'#67748c','font-size':'18'},'データの到着を待っています'));return}
for(const [k,color] of [['immediate','#2EAA6E'],['delayed','#E8973A']]){
 const vals=s[k].map(n=>n/s.count*100);g.append(svgEl('polyline',{points:vals.map((v,i)=>x(i)+','+y(v)).join(' '),fill:'none',stroke:color,'stroke-width':'3.2','stroke-linejoin':'round'}));vals.forEach((v,i)=>g.append(svgEl('circle',{cx:x(i),cy:y(v),r:4,fill:color})))}
}
function display(s){if(!s||!Number.isInteger(s.count)||s.count<0||!['immediate','delayed'].every(k=>Array.isArray(s[k])&&s[k].length===15&&s[k].every(n=>typeof n==='number'&&n>=0&&n<=s.count)))throw Error('集計データが不正です');
$('count').textContent=s.count;$('updated').textContent=new Date(s.updated).toLocaleString('ja-JP');draw(s);
const target=$('region');target.replaceChildren();for(const [key,name] of [['immediate','直後再生'],['delayed','妨害課題後再生']]){const tr=document.createElement('tr');const vals=s.count?[0,1,2].map(i=>(s[key].slice(i*5,i*5+5).reduce((a,b)=>a+b,0)/s.count/5*100).toFixed(1)+'%'):['—','—','—'];for(const v of [name,...vals]){const td=document.createElement('td');td.textContent=v;tr.append(td)}target.append(tr)}$('status').textContent='集計データを読み込みました。'}
let busy=false;
function refresh(){if(busy)return;if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(GAS_WEB_APP_URL)){$('status').textContent='管理者によるGAS送信先URLの設定が必要です。';return}
busy=true;$('status').textContent='読み込み中…';const name='spSummary_'+Math.random().toString(36).slice(2,12);let script=document.createElement('script');const timeout=setTimeout(()=>done('集計を取得できませんでした。URL・公開設定を確認してください。'),12000);
function done(error){clearTimeout(timeout);busy=false;delete window[name];script.remove();if(error)$('status').textContent=error}
window[name]=(data)=>{try{display(data);done()}catch(e){done('集計の表示に失敗しました：'+e.message)}};
script.onerror=()=>done('読み込みに失敗しました。');script.src=GAS_WEB_APP_URL+'?action=summary&callback='+name+'&t='+Date.now();document.head.append(script)}
$('refresh').onclick=refresh;refresh();setInterval(refresh,45000);
</script></body></html>
