function source(parent=app){const p=el('p','出典：豊田弘司・山本晃輔（2011）日本版WLEIS（Wong and Law Emotional Intelligence Scale）の作成．教育実践総合センター研究紀要，20，7–12．',parent);p.className='muted';const a=el('a','原著論文',p);a.href='https://nara-edu.repo.nii.ac.jp/records/9680';a.target='_blank';a.rel='noopener noreferrer';}

  const panel=el('div');panel.className='panel';
  el('p','この実習は教育目的であり，知能検査や診断ではありません。氏名・学籍番号は収集しません。回答終了後，匿名回答ID，回答日時，年齢，性別，各項目の回答，得点を担当教員のスプレッドシートに自動で記録します。内容を確認し，データの保存に同意してから開始してください。',panel);

}
function question(){clear();el('div',`QUESTION ${index+1} / 16`).className='eyebrow';const bar=el('div');bar.className='progress';bar.setAttribute('role','progressbar');bar.setAttribute('aria-valuemin','0');bar.setAttribute('aria-valuemax','16');bar.setAttribute('aria-valuenow',String(index+1));el('div',undefined,bar).style.width=`${(index+1)/16*100}%`;el('h2',ITEMS[index]);el('p','最もあてはまる選択肢を1つ選んでください。').className='muted';const group=el('div');group.className='choices';group.setAttribute('role','group');group.setAttribute('aria-label','7段階評定');let next;LABELS.forEach((label,i)=>{const b=btn('',()=>{answers[index]=i+1;Array.from(group.children).forEach((x,j)=>x.setAttribute('aria-pressed',String(j===i)));next.disabled=false;},group);b.className='choice';el('strong',String(i+1),b);el('span',label,b);b.setAttribute('aria-pressed',String(answers[index]===i+1));});const nav=el('div');nav.className='nav';btn('戻る',()=>{if(index===0)start();else{index--;question();}},nav);next=btn(index===15?'回答を終了する':'次へ',()=>{if(answers[index]===null)return;if(index===15){if(answers.every(v=>Number.isInteger(v)&&v>=1&&v<=7))result();}else{index++;question();}},nav,true);next.disabled=answers[index]===null;}
function chart(values){const ns='http://www.w3.org/2000/svg';const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 560 390');svg.setAttribute('role','img');svg.setAttribute('aria-label','4尺度のレーダーチャート。ネイビーの実線が自己評価，緑破線が先行研究平均。数値は後の表にも記載。');app.append(svg);const cx=280,cy=194,R=119;function node(tag,attrs,text){const n=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);if(text!==undefined)n.textContent=text;svg.append(n);return n;}function point(v,i){const a=i*Math.PI/2-Math.PI/2,r=(v-1)/6*R;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}function poly(arr){return arr.map(point).map(p=>p.join(',')).join(' ');}for(let n=2;n<=7;n++){node('polygon',{points:poly([n,n,n,n]),fill:'none',stroke:'#E2E8F0','stroke-width':1});node('text',{x:cx+5,y:cy-(n-1)*R/6+3,'font-size':11,fill:'#596579'},String(n));}node('text',{x:cx+5,y:cy+4,'font-size':11,fill:'#596579'},'1');NAMES.forEach((s,i)=>{const p=point(7,i);node('line',{x1:cx,y1:cy,x2:p[0],y2:p[1],stroke:'#8A94A6'});const xy=[[280,28],[468,178],[280,349],[92,178]][i];const parts=i===1?['他者の','情動評価']:i===3?['情動の','調節']:[s];parts.forEach((t,j)=>node('text',{x:xy[0],y:xy[1]+j*21,'text-anchor':'middle','font-size':17,'font-weight':'bold',fill:'#1A2340'},t));node('text',{x:xy[0],y:xy[1]+parts.length*21+4,'text-anchor':'middle','font-size':16,fill:'#243055','font-weight':'bold'},values[i].toFixed(2));});node('polygon',{points:poly(REF),fill:'#1E7A4E','fill-opacity':.06,stroke:'#1E7A4E','stroke-width':2.8,'stroke-dasharray':'7 5'});node('polygon',{points:poly(values),fill:'#243055','fill-opacity':.18,stroke:'#243055','stroke-width':3});values.forEach((v,i)=>{const p=point(v,i);node('circle',{cx:p[0],cy:p[1],r:4.8,fill:'#243055',stroke:'white','stroke-width':1});});}
function result(){clear();heading('あなたの情動知能プロフィール');el('p','4つの領域について，自分の回答と先行研究の平均を比較します。');const scores=score(answers);const legend=el('div');legend.className='legend';el('span','あなたの得点',legend);el('span','先行研究の平均',legend).className='ref';chart(scores);const table=el('table');const head=el('thead',undefined,table),hr=el('tr',undefined,head);['下位尺度','あなた','研究平均','差'].forEach(t=>{el('th',t,hr).scope='col';});const body=el('tbody',undefined,table);NAMES.forEach((n,i)=>{const tr=el('tr',undefined,body);el('th',n,tr).scope='row';const d=scores[i]-REF[i];[scores[i].toFixed(2),REF[i].toFixed(2),(d>=0?'+':'')+d.toFixed(2)].forEach(t=>el('td',t,tr));});el('p','全16項目の平均：'+(answers.reduce((a,b)=>a+b,0)/16).toFixed(2)+' / 7').className='muted';el('p','比較対象：豊田・山本（2011），大学生321名，平均年齢19歳2か月。研究平均はTable 1の丸められた項目平均を各4項目で平均した近似値です。差は丸め前の比較値を使って算出しています。全国標準値ではなく，偏差値・順位・診断を意味しません。').className='muted';const box=el('div');box.className='panel';el('h2','結果の読み方',box);NAMES.forEach((n,i)=>{const p=el('p',undefined,box);el('strong',n+'：',p);p.append(document.createTextNode(DESCRIPTIONS[i]));});el('p','得点は感情に関する自己認識を表し，実際の課題遂行能力を直接測定したものではありません。平均より高い／低いことは優劣を示すものではありません。',box);const savebox=el('div');savebox.className='panel';const intro=app.querySelector('h1');if(intro)intro.after(savebox);el('h2','回答データの保存',savebox);const status=el('p','',savebox);status.id='status';status.setAttribute('role','status');status.setAttribute('aria-live','polite');{const retry=btn('保存を再試行',send,savebox,true);retry.hidden=true;function setStatus(t,state){status.textContent=t;status.dataset.state=state||'';}async function send(){
